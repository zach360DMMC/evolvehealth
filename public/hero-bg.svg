      <stop offset="0%" stop-color="#6C8CA3" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1D3557" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#8AADC4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#162843" stop-opacity="0"/>
